# pyproject.toml tells Python tools (pip, pytest) what this project is
# and what it needs. Install it for development with:
#     pip install -e ".[dev]"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-core-console"
version = "0.1.0"
description = "Runs preset read-only 'protocols' against a local LLM (Ollama) and checks its answers."
readme = "README.md"
requires-python = ">=3.11"   # 3.11 includes tomllib for reading .toml files
dependencies = [
    "jsonschema>=4.20",      # checks the model's JSON answers against a schema
    "rich>=13",              # coloured text and tables in the terminal
    "textual>=0.80",         # the full-screen dashboard
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",  # needed later to test the dashboard
]

[project.scripts]
# After installing, typing `aicore` in a terminal runs core/cli.py:main
aicore = "core.cli:main"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
