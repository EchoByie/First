# The ONLY places the Update section may download from.
#
# Rules enforced in code (core/updater/fetch.py):
#   - https only, to the exact hosts that appear in this file
#   - redirects are followed only if they stay on those hosts over https
#   - nothing is downloaded unless you ask (button / `aicore update`)
#   - downloaded files are checked like any import before they replace
#     anything; a bad download leaves the old data in place

